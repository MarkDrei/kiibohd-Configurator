name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 12 matches .node-version. Native addons (node-sass, usb) are not
      # needed for tsc/eslint/unit tests, so install skips their build scripts.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '12.14.0'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: yarn validate-typescript

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test
